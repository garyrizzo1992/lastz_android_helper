name: Go truck scanner

on:
  push:
    branches: [main]
    paths: ['tools/truck-scanner/**', 'images/truck_scanner/**', 'config/truck_scanner*.json', 'tests/fixtures/truck_*.png', '.github/workflows/truck-scanner.yaml']
  pull_request:
    paths: ['tools/truck-scanner/**', 'images/truck_scanner/**', 'config/truck_scanner*.json', 'tests/fixtures/truck_*.png', '.github/workflows/truck-scanner.yaml']

permissions:
  contents: read

jobs:
  test-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
    defaults:
      run:
        working-directory: tools/truck-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go test -count=1 ./...
      - run: go vet ./...
      - run: go build -o ../../bin/truck-scanner.exe .
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: truck-scanner-windows
          path: bin/truck-scanner.exe
